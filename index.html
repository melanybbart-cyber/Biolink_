<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melany Barba Bejarano</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="profile-header">
            <div class="profile-icon">
                <i class="fas fa-palette"></i>
            </div>
            <h1 class="profile-name">Melany Barba Bejarano</h1>
            <p class="profile-bio">Artista visual | Pintora</p>
            <div class="profile-location">
                <i class="fas fa-map-marker-alt"></i>
                <span>Cuauhtémoc, Chihuahua</span>
            </div>
        </header>

        <main class="links-container">
            <a href="https://www.instagram.com/melany_con_igriega/" class="link-button">
                <i class="fab fa-instagram"></i>
                <span>Instagram Personal</span>
            </a>
            
            <a href="https://www.instagram.com/art.melany_/" class="link-button">
                <i class="fas fa-paint-brush"></i>
                <span>Instagram De Arte</span>
            </a>
            
            <a href="https://melanybb.art/" class="link-button">
                <i class="fas fa-globe"></i>
                <span>Página Web</span>
            </a>
            
            <!-- CORREO CORREGIDO - Abre app de email predeterminada -->
            <a href="https://mail.google.com/mail/?view=cm&fs=1&to=melanybb.art@gmail.com&su=Interesado%20en%20tu%20arte&body=Hola%20Melany,%0A%0AHe%20visto%20tu%20trabajo%20y%20me%20encanta.%20¿Podrías%20compartirme%20más%20información%20sobre:%0A-%20Precios%0A-%20Disponibilidad%0A-%20Encargos%0A%0AGracias," 
               class="link-button" target="_blank">
                <i class="fas fa-envelope"></i>
                <span>Correo Electrónico</span>
            </a>
        </main>

        <footer class="social-links">
            <p>Sígueme en redes sociales</p>
            <div class="social-icons">
                <a href="https://www.instagram.com/melany_con_igriega/" class="social-icon">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://www.instagram.com/art.melany_/" class="social-icon">
                    <i class="fas fa-paint-brush"></i>
                </a>
            </div>
        </footer>
    </div>

    <div id="particles-js"></div>
    
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS('particles-js', {
            particles: {
                number: { value: 40, density: { enable: true, value_area: 800 } },
                color: { value: "#ffffff" },
                opacity: { value: 0.7 },
                size: { value: 3 },
                line_linked: {
                    enable: false,        // ← ACTIVADO para que se unan
                    distance: 150,
                    color: "#ffffff",
                    opacity: 0.3,
                    width: 1
                },
                move: { enable: true, speed: 1 }
            }
        });
    </script>
</body>
</html>
